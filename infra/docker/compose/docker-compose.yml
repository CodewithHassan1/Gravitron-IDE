version: "3.8"

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    # postgres:16 underlying image with pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ag_password}
      POSTGRES_DB: ${POSTGRES_DB:-ag_ide}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ag_user} -d ${POSTGRES_DB:-ag_ide}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ag_network
    restart: unless-stopped

  redis:
    image: redis:8.0-M02-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ag_network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20.0-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "wget", "http://localhost:7474", "-O", "-" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ag_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ag_network
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7.0
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ag_network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ag_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.17
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ag_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ag-ide.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ag_network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8085:8081"
    networks:
      - ag_network
    restart: unless-stopped

networks:
  ag_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  kafka_data:
  minio_data:
  pgadmin_data:
