name: Workspace Engine Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/services/workspace/**'
      - 'tests/architecture/**'
      - 'tests/workspace/**'
      - 'benchmarks/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/services/workspace/**'
      - 'tests/architecture/**'
      - 'tests/workspace/**'
      - 'benchmarks/**'

jobs:
  validate:
    name: Architecture & Reliability Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Architecture Enforcement
        run: npx vitest run tests/architecture/

      - name: 2. Functional & Stress Validation
        run: npx vitest run tests/workspace/

      - name: 3. Production Soak & Memory Checks
        run: npx vitest run tests/workspace/soak/ tests/workspace/memory/

      - name: 4. Performance Benchmarks
        run: npx vitest run --config vitest.benchmark.config.ts

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-benchmark-results
          path: benchmarks/latest.md
